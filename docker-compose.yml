version: '3.8'

services:

  # Backend API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: retail-sales-backend

    ports:
      - "7000:7000"

    environment:
      NODE_ENV: production
      PORT: 7000
      MONGODB_URL: ${MONGODB_URL}

    restart: unless-stopped

    depends_on:
      mongodb:
        condition: service_healthy

    networks:
      - retail-network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  # Frontend React + Vite App
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: retail-sales-frontend

    ports:
      - "3000:80"

    environment:
      VITE_API_BASE_URL: http://backend:7000/api

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - retail-network


  # MongoDB Database
  mongodb:
    image: mongo:7

    container_name: retail-sales-mongodb

    ports:
      - "27017:27017"

    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: mongoadmin

    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb

    restart: unless-stopped

    networks:
      - retail-network

    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5


volumes:
  mongodb_data:
  mongodb_config:


networks:
  retail-network:
    driver: bridge